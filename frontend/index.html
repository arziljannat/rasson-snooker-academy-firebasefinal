<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
    
    <title>Login – Rasson Snooker Academy</title>
    <link rel="stylesheet" href="login.css">
    <link rel="stylesheet" href="styles/mobile.css">
    
</head>

<body>

<div class="login-container">

    <div class="login-box">

        <h1 class="login-title">Rasson Snooker Academy</h1>

        <input type="text" id="branchCode" class="login-input" placeholder="Enter Branch Code">

        <input type="text" id="loginUserId" class="login-input" placeholder="Enter User ID">

        <input type="password" id="loginPassword" class="login-input" placeholder="Enter Password">

        <button class="login-btn" onclick="loginUser()">Login</button>


        <p id="errorMsg" class="error-text"></p>

    </div>

</div>
<script type="module" src="scripts/firebase-config.js"></script>
<script type="module" src="login2.js"></script>

    
    
</body>
</html>
