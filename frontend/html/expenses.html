<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Expenses</title>

    <!-- NAVBAR CSS -->
    <link rel="stylesheet" href="../styles/navbar.css">
    <link rel="stylesheet" href="../styles/mobile.css">

    <!-- PAGE CSS -->
    <link rel="stylesheet" href="../styles/expenses.css">

    <!-- SCRIPTS -->
    <script type="module" src="../scripts/firebase-config.js"></script>
    <script type="module" src="../scripts/load-navbar.js"></script>
    <script src="../scripts/navbar.js" defer></script>
    <script type="module" src="../scripts/expenses.js"></script>
</head>

<body>
<div class="page-container">

    <h1 class="page-title">Expenses</h1>

    <!-- EXPENSE TYPE -->
    <div class="filter-row">
        <label class="filter-label">Expense Type:</label>

        <select
            id="filterType"
            class="filter-select"
            onchange="filterByType()"
        >
            <option value="all">All</option>
            <option value="daily">Daily</option>
            <option value="monthly">Monthly</option>
        </select>
    </div>

    <!-- DAY FILTER -->
    <div class="filter-row">

        <label class="filter-label">Day Filter:</label>

        <select
            id="dayFilter"
            class="filter-select"
            onchange="filterByDay()"
        >
            <option value="all">All Days</option>
            <option value="current">Current Day</option>
        </select>

    </div>

    <!-- MONTH FILTER -->
<div class="filter-row admin-only" id="monthFilterBox">

    <label class="filter-label">
        From Date:
    </label>

    <input
        type="date"
        id="fromDate"
        class="filter-select"
        onchange="filterByDateRange()"
    >

</div>

<div class="filter-row admin-only">

    <label class="filter-label">
        To Date:
    </label>

    <input
        type="date"
        id="toDate"
        class="filter-select"
        onchange="filterByDateRange()"
    >

</div>

    <!-- ACTIONS -->
    <div class="top-actions">

        <button
            class="btn-green"
            onclick="openAddPopup()"
        >
            + Add Expense
        </button>

        <input
            type="text"
            id="searchInput"
            class="search-bar"
            placeholder="Search..."
            onkeyup="searchExpenses()"
        >

    </div>

    <!-- TOTAL -->
    <div class="total-box">
        <span>Today's Total:</span>
        <b id="todayTotal">0 PKR</b>
    </div>

    <!-- TABLE -->
    <div class="table-box">

        <table class="exp-table">

            <thead>
                <tr>
                    <th>Title</th>
                    <th>Amount</th>
                    <th>Type</th>
                    <th>Shift</th>
                    <th>Date & Time</th>
                    <th>Actions</th>
                </tr>
            </thead>

            <tbody id="expensesBody"></tbody>

        </table>

    </div>

</div>

<!-- ADD POPUP -->
<div id="addPopup" class="popup hide">

    <div class="popup-card">

        <h2>Add Expense</h2>

        <label class="lbl">Expense Type</label>

        <select id="newType" class="popup-input">
            <option value="daily">Daily</option>
            <option value="monthly">Monthly</option>
        </select>

        <select id="newShift" class="popup-input">

    <option value="shift1">
        Shift 1
    </option>

    <option value="shift2">
        Shift 2
    </option>

</select>

        <input
            id="newTitle"
            class="popup-input"
            placeholder="Expense Title"
        >

        <input
            id="newAmount"
            type="number"
            class="popup-input"
            placeholder="Amount"
        >

        <input
            id="newDate"
            type="datetime-local"
            class="popup-input admin-only"
        >

        <div class="popup-actions">

            <button
                class="btn-green"
                onclick="saveExpense()"
            >
                Save
            </button>

            <button
                class="btn-red"
                onclick="closeAddPopup()"
            >
                Cancel
            </button>

        </div>

    </div>

</div>

<!-- EDIT POPUP -->
<div id="editPopup" class="popup hide">

    <div class="popup-card">

        <h2>Edit Expense</h2>

        <label class="lbl">Expense Type</label>

        <select id="editType" class="popup-input">
            <option value="daily">Daily</option>
            <option value="monthly">Monthly</option>
        </select>

        <select id="editShift" class="popup-input">

    <option value="shift1">
        Shift 1
    </option>

    <option value="shift2">
        Shift 2
    </option>

</select>

        <input
            id="editTitle"
            class="popup-input"
        >

        <input
            id="editAmount"
            type="number"
            class="popup-input"
        >

        <input
            id="editDate"
            type="datetime-local"
            class="popup-input"
        >

        <div class="popup-actions">

            <button
                class="btn-green"
                onclick="updateExpense()"
            >
                Update
            </button>

            <button
                class="btn-red"
                onclick="closeEditPopup()"
            >
                Cancel
            </button>

        </div>

    </div>

</div>

</body>
</html>
